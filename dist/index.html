        .navbar-header {
          position: sticky;
          top: 0;
          z-index: 100;
          background: #FFFFFF;
          border-bottom: 1px solid var(--border-light);
          box-shadow: var(--shadow-sm);
        }
        .top-bar {
          background-color: var(--text-primary);
          color: #E6E0D4;
          font-size: 0.75rem;
          padding: 0.35rem 0;
          letter-spacing: 0.03em;
        }
        .top-bar-content {
          display: flex;
          justify-content: space-between;
          align-items: center;
          flex-wrap: wrap;
          gap: 0.5rem;
        }
        .top-location {
          font-weight: 500;
          color: #D6CFBE;
        }
        .top-social-contacts {
          display: flex;
          align-items: center;
          gap: 0.6rem;
        }
        .top-dot {
          color: #666;
        }
        .main-nav-container {
          padding: 0.85rem 0;
          background-color: #FFFFFF;
        }
        .main-nav {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .logo-brand {
          display: flex;
          align-items: center;
          gap: 0.65rem;
          cursor: pointer;
        }
        .header-brand-logo-img {
          height: 44px;
          width: auto;
          object-fit: contain;
          border-radius: var(--radius-sm);
        }
        .logo-emblem {
          width: 38px;
          height: 38px;
          background-color: var(--text-primary);
          color: var(--accent-gold);
          font-family: var(--font-heading);
          font-size: 1.5rem;
          font-weight: 700;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: var(--radius-sm);
          border: 1px solid var(--accent-gold);
        }
        .logo-text {
          display: flex;
          flex-direction: column;
        }
        .brand-name {
          font-family: var(--font-heading);
          font-size: 1.25rem;
          font-weight: 700;
          letter-spacing: 0.05em;
          color: var(--text-primary);
          line-height: 1.1;
        }
        .brand-sub {
          font-size: 0.65rem;
          letter-spacing: 0.2em;
          color: var(--accent-gold-dark);
          font-weight: 600;
        }
        .nav-and-icons-group {
          display: flex;
          align-items: center;
          gap: 1.5rem;
        }
        .desktop-menu {
          display: none;
          align-items: center;
          gap: 1.5rem;
        }
        @media (min-width: 900px) {
          .desktop-menu {
            display: flex;
          }
        }
        .nav-link {
          font-size: 0.825rem;
          font-weight: 600;
          letter-spacing: 0.08em;
          color: var(--text-secondary);
          padding: 0.35rem 0;
          position: relative;
          transition: var(--transition-smooth);
        }
        .nav-link:hover, .nav-link.active {
          color: var(--text-primary);
        }
        .nav-link.active::after {
          content: '';
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 2px;
          background-color: var(--accent-gold);
        }
        .inline-header-icons {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          padding-left: 0.75rem;
          border-left: 1px solid var(--border-color);
        }
        .header-icon-btn {
          width: 34px;
          height: 34px;
          border-radius: var(--radius-full);
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: var(--bg-main);
          border: 1px solid var(--border-color);
          color: var(--text-primary);
          transition: var(--transition-smooth);
          text-decoration: none;
        }
        .header-icon-btn.theme-toggle-btn:hover {
          background-color: var(--accent-gold-light);
          border-color: var(--accent-gold);
          transform: translateY(-2px) scale(1.05);
        }
        .sun-icon { color: #F59E0B; }
        .moon-icon { color: #8B5CF6; }
        .header-icon-btn.nav-wa:hover {
          background-color: #25D366;
          border-color: #25D366;
          color: #FFFFFF;
          transform: translateY(-2px);
        }
        .header-icon-btn.nav-mail:hover {
          background-color: var(--text-primary);
          border-color: var(--text-primary);
          color: var(--accent-gold);
          transform: translateY(-2px);
        }
        .header-icon-btn.nav-insta:hover {
          background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
          border-color: #E1306C;
          color: #FFFFFF;
          transform: translateY(-2px);
        }
        .nav-actions {
          display: flex;
          align-items: center;
          gap: 0.75rem;
        }
        .mobile-hamburger {
          display: block;
          color: var(--text-primary);
          padding: 0.25rem;
        }
        @media (min-width: 900px) {
          .mobile-hamburger {
            display: none;
          }
        }
        .mobile-drawer {
          background: #FFFFFF;
          border-bottom: 1px solid var(--border-color);
          padding: 1rem 1.25rem 1.5rem;
          box-shadow: var(--shadow-md);
        }
        .mobile-menu-links {
          display: flex;
          flex-direction: column;
          gap: 0.85rem;
          margin-bottom: 1rem;
        }
        .mobile-nav-link {
          text-align: left;
          font-size: 1rem;
          font-weight: 600;
          letter-spacing: 0.06em;
          padding: 0.5rem 0;
          color: var(--text-secondary);
          border-bottom: 1px dashed var(--border-light);
        }
        .mobile-nav-link.active {
          color: var(--accent-gold-dark);
          font-weight: 700;
        }
        .mobile-social-bar {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          padding-top: 0.75rem;
          border-top: 1px solid var(--border-light);
        }
        .mobile-social-item {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          font-size: 0.85rem;
          font-weight: 600;
          color: var(--text-primary);
          text-decoration: none;
        }
        .mobile-social-item.wa { color: #25D366; }
        .mobile-social-item.mail { color: var(--accent-gold-dark); }
        .mobile-social-item.insta { color: #E1306C; }
        @media (max-width: 650px) {
          .top-bar-content {
            flex-direction: column;
            gap: 0.3rem;
            text-align: center;
          }
          .inline-header-icons {
            border-left: none;
            padding-left: 0;
          }
        }

          border: 1px solid var(--border-color);
          overflow: hidden;
          box-shadow: var(--shadow-sm);
          aspect-ratio: 1 / 1;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .category-float-badge {
          position: absolute;
          top: 1rem;
          left: 1rem;
          z-index: 2;
        }
        .subcategory-float-badge {
          position: absolute;
          top: 1rem;
          right: 1rem;
          z-index: 2;
          background: rgba(28, 28, 28, 0.85);
          color: #FFFFFF;
          font-size: 0.725rem;
          font-weight: 700;
          padding: 0.35rem 0.75rem;
          border-radius: var(--radius-full);
          backdrop-filter: blur(4px);
        }

        .product-main-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: transform 0.4s ease;
        }
        .main-image-card:hover .product-main-img {
          transform: scale(1.05);
        }

        .guarantee-pills-row {
          display: flex;
          flex-direction: column;
          gap: 0.6rem;
        }
        .guarantee-pill {
          background-color: var(--bg-main);
          border: 1px solid var(--border-color);
          padding: 0.65rem 1rem;
          border-radius: var(--radius-sm);
          font-size: 0.825rem;
          font-weight: 600;
          color: var(--text-primary);
          display: flex;
          align-items: center;
          gap: 0.6rem;
        }
        .pill-icon {
          color: var(--accent-gold-dark);
        }

        /* Right Info Column */
        .showcase-info-col {
          display: flex;
          flex-direction: column;
          gap: 1.25rem;
        }

        .info-meta-tags {
          display: flex;
          align-items: center;
          gap: 0.5rem;
        }
        .meta-subcat-chip {
          font-size: 0.75rem;
          font-weight: 700;
          color: var(--text-secondary);
          background-color: var(--bg-main);
          padding: 0.25rem 0.75rem;
          border-radius: var(--radius-full);
          border: 1px solid var(--border-color);
        }

        .detail-product-title {
          font-family: var(--font-heading);
          font-size: 2.2rem;
          font-weight: 700;
          color: var(--text-primary);
          line-height: 1.2;
        }
        @media (min-width: 768px) {
          .detail-product-title {
            font-size: 2.6rem;
          }
        }

        .detail-price-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 1rem;
        }

        .detail-price {
          font-family: var(--font-heading);
          font-size: 2.25rem;
          font-weight: 700;
          color: var(--accent-gold-dark);
        }

        .stock-status-badge {
          font-size: 0.8rem;
          font-weight: 700;
          padding: 0.4rem 0.85rem;
          border-radius: var(--radius-full);
          display: inline-flex;
          align-items: center;
          gap: 0.35rem;
        }
        .stock-status-badge.in-stock {
          background-color: #DEF7EC;
          color: #03543F;
        }
        .stock-status-badge.out-stock {
          background-color: #FDE8E8;
          color: #9B1C1C;
        }

        .detail-divider {
          height: 1px;
          background-color: var(--border-color);
        }

        .detail-desc-box {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
        }
        .desc-heading {
          font-size: 0.85rem;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: var(--text-secondary);
        }
        .desc-text {
          font-size: 1rem;
          color: var(--text-primary);
          line-height: 1.6;
        }

        /* Specifications Card */
        .specs-card {
          background-color: var(--bg-main);
          border: 1px solid var(--border-color);
          border-radius: var(--radius-sm);
          padding: 1.25rem;
        }
        .specs-heading {
          font-size: 0.8rem;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: var(--text-primary);
          margin-bottom: 0.75rem;
          padding-bottom: 0.35rem;
          border-bottom: 1px solid var(--border-color);
        }
        .specs-table {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
        }
        .spec-row {
          display: flex;
          justify-content: space-between;
          font-size: 0.85rem;
        }
        .spec-label {
          color: var(--text-secondary);
          width: 40%;
        }
        .spec-val {
          color: var(--text-primary);
          width: 60%;
          text-align: right;
        }

        /* Action Buttons Box */
        .detail-actions-box {
          display: flex;
          flex-direction: column;
          gap: 0.85rem;
          margin-top: 0.5rem;
        }
        @media (min-width: 600px) {
          .detail-actions-box {
            flex-direction: row;
          }
        }

        .detail-buy-now-btn {
          flex-grow: 1;
          padding: 1rem 1.5rem;
          font-size: 0.875rem;
        }
        .detail-wa-btn {
          flex-grow: 1;
          padding: 1rem 1.5rem;
          font-size: 0.875rem;
        }

        .store-address-notice {
          display: flex;
          align-items: flex-start;
          gap: 0.6rem;
          background-color: var(--bg-main);
          border: 1px solid var(--border-color);
          padding: 0.85rem 1rem;
          border-radius: var(--radius-sm);
          font-size: 0.8rem;
          color: var(--text-secondary);
        }
        .pin-icon {
          color: var(--accent-gold-dark);
          flex-shrink: 0;
          margin-top: 2px;
        }

        /* Related Products */
        .related-products-section {
          margin-top: 4rem;
        }
        .related-header {
          text-align: center;
          margin-bottom: 2rem;
        }
        .related-title {
          font-family: var(--font-heading);
          font-size: 1.85rem;
          font-weight: 700;
          color: var(--text-primary);
          margin-top: 0.25rem;
        }

        .related-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 1.25rem;
        }
        @media (min-width: 768px) {
          .related-grid {
            grid-template-columns: repeat(4, 1fr);
          }
        }

        .related-product-card {
          background-color: var(--bg-surface);
          border: 1px solid var(--border-color);
          border-radius: var(--radius-sm);
          overflow: hidden;
          cursor: pointer;
          transition: all 0.25s ease;
        }
        .related-product-card:hover {
          transform: translateY(-4px);
          box-shadow: var(--shadow-md);
          border-color: var(--accent-gold);
        }
        .related-product-card img {
          width: 100%;
          height: 160px;
          object-fit: cover;
        }
        .related-card-body {
          padding: 0.85rem;
        }
        .related-name {
          font-size: 0.9rem;
          font-weight: 700;
          color: var(--text-primary);
          margin: 0.35rem 0;

        }
        .related-price {
          font-family: var(--font-heading);
          font-size: 1.05rem;
          font-weight: 700;
          color: var(--accent-gold-dark);
        }

          border-radius: 99px;
          animation: linePulse 2.5s infinite ease-in-out;

        @keyframes linePulse {
          0%, 100% { transform: scaleX(0.7); opacity: 0.6; }
          50% { transform: scaleX(1.3); opacity: 1; }

          margin: 0 auto;

            grid-template-columns: 1fr 1.15fr;

        .reviews-section {
          padding: 5rem 0;
          background-color: var(--bg-main);
          border-bottom: 1px solid var(--border-light);
          position: relative;
        }

        .reviews-chip-badge {
          display: inline-flex;
          align-items: center;
          gap: 0.4rem;
          background-color: var(--accent-gold-light);
          color: var(--accent-gold-dark);
          font-size: 0.75rem;
          font-weight: 700;
          letter-spacing: 0.12em;
          padding: 0.4rem 1rem;
          border-radius: var(--radius-full);
          margin-bottom: 0.85rem;
          border: 1px solid var(--accent-gold);
        }

        .reviews-dashboard-card {
          background-color: var(--bg-surface);
          border-radius: var(--radius-md);
          border: 1px solid var(--border-color);
          padding: 2rem;
          box-shadow: var(--shadow-md);
          display: grid;
          grid-template-columns: 1fr;
          gap: 2rem;
          align-items: center;
          margin-bottom: 2.5rem;
        }
        @media (min-width: 900px) {
          .reviews-dashboard-card {
            grid-template-columns: 1.1fr 1.2fr 1fr;
          }
        }

        .dashboard-left {
          display: flex;
          align-items: center;
          gap: 1.25rem;
        }
        .rating-score-circle {
          width: 80px;
          height: 80px;
          background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-dark) 100%);
          color: #FFFFFF;
          border-radius: var(--radius-full);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          box-shadow: 0 8px 20px rgba(197, 160, 89, 0.35);
          flex-shrink: 0;
        }
        .big-num {
          font-family: var(--font-heading);
          font-size: 2.2rem;
          font-weight: 700;
          line-height: 1;
        }
        .out-of {
          font-size: 0.65rem;
          opacity: 0.9;
        }
        .rating-stars-animated {
          color: #FFB800;
          font-size: 1.25rem;
          letter-spacing: 0.1em;
        }
        .total-reviews-txt {
          font-size: 0.825rem;
          color: var(--text-secondary);
          margin-top: 0.2rem;
        }
        .trust-badge {
          font-size: 0.725rem;
          color: var(--accent-gold-dark);
          font-weight: 700;
          display: inline-flex;
          align-items: center;
          gap: 0.3rem;
          margin-top: 0.35rem;
        }

        .dashboard-middle {
          display: flex;
          flex-direction: column;
          gap: 0.6rem;
        }
        .bar-row {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          font-size: 0.8rem;
          color: var(--text-secondary);
        }
        .bar-label { width: 50px; font-weight: 600; }
        .bar-track {
          flex-grow: 1;
          height: 8px;
          background-color: var(--border-light);
          border-radius: 99px;
          overflow: hidden;
        }
        .bar-fill {
          height: 100%;
          background: linear-gradient(90deg, var(--accent-gold), var(--accent-gold-dark));
          border-radius: 99px;
          transition: width 0.8s ease;
        }
        .bar-count { width: 25px; text-align: right; font-weight: 700; }

        .dashboard-right {
          text-align: center;
        }
        .btn-add-review-motion {
          padding: 0.9rem 1.5rem;
          font-size: 0.85rem;
          width: 100%;
        }

        .reviews-filter-bar {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          margin-bottom: 2rem;
          overflow-x: auto;
          padding-bottom: 0.25rem;
        }
        .filter-lbl {
          font-size: 0.8rem;
          font-weight: 700;
          color: var(--text-secondary);
          display: flex;
          align-items: center;
          gap: 0.3rem;

          padding: 0.5rem 1.15rem;
          border-radius: var(--radius-full);

          border: 1px solid var(--border-color);
          color: var(--text-secondary);
          white-space: nowrap;
          transition: var(--transition-smooth);
        }
        .rev-filter-chip:hover, .rev-filter-chip.active {
          background-color: var(--text-primary);
          color: #FFFFFF;
          border-color: var(--text-primary);

          grid-template-columns: repeat(1, 1fr);

            grid-template-columns: repeat(3, 1fr);
          }

          display: flex;

          gap: 0.75rem;

          flex-grow: 1;
        }

          font-size: 1.05rem;
          font-weight: 700;
          color: var(--text-primary);
        }
        .reviewer-location {
          font-size: 0.75rem;
          color: var(--text-muted);
        }
        .verified-chip {
          font-size: 0.7rem;
          color: #03543F;
          background-color: #DEF7EC;
          padding: 0.2rem 0.55rem;
          border-radius: var(--radius-full);
          font-weight: 700;
          display: flex;
          align-items: center;
          gap: 0.25rem;
        }

        .rating-date-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .stars-flex {
          display: flex;
          gap: 0.15rem;
        }
        .star-gold {
          color: #E2E8F0;
          font-size: 1.15rem;
        }
        .star-gold.active {
          color: #FFB800;
        }
        .rev-date-str {
          font-size: 0.75rem;
          color: var(--text-muted);
        }

        .review-comment-body {
          font-size: 0.9rem;
          color: var(--text-secondary);
          line-height: 1.6;
          font-style: italic;
          position: relative;
          z-index: 1;

        .card-footer-action {
          display: flex;

          z-index: 1;

          background-color: var(--accent-gold-light);
